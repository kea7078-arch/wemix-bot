name: Wemix Bot

on:
  schedule:
    - cron: '0 * * * *' # 매 정각마다 실행 (서버 부하 방지를 위해 1시간 단위 추천)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 이 줄이 권한을 명시적으로 선언합니다.
      
    steps:
      - uses: actions/checkout@v4 # v3에서 v4로 업데이트
      - name: Set up Python
        uses: actions/setup-python@v5 # v4에서 v5로 업데이트
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          pip install requests selenium webdriver-manager
          
      - name: Run Bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python bot.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          # 파일이 없으면 새로 만들고, 있으면 추가합니다.
          touch last_counts.json
          git add last_counts.json
          git commit -m "Update counts" || exit 0
          git push
