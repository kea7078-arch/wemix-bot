name: Wemix Bot

on:
  schedule:
    - cron: '0 * * * *' # 1시간마다 실행
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
        with:
          # 수첩 파일을 다시 서버에 올리기 위해 '본인 인증' 토큰을 명시합니다.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          pip install requests selenium webdriver-manager
          
      - name: Run Bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python bot.py
        
      - name: Commit and Push changes
        run: |
          # 봇의 신분증을 더 확실하게 등록합니다.
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 수첩 파일이 없으면 만들고, 있으면 추가합니다.
          touch last_counts.json
          git add last_counts.json
          
          # 변경사항이 있으면 저장하고, 없으면 그냥 끝냅니다.
          if ! git diff --cached --quiet; then
            git commit -m "Update counts"
            # 강제로 내 저장소에 밀어 넣습니다.
            git push origin main
          else
            echo "변경 사항이 없어 저장을 건너뜁니다."
          fi
