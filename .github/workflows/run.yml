import requests
import os
import json
import time
from selenium import webdriver
from selenium.webdriver.chrome.options import Options
from selenium.webdriver.chrome.service import Service
from selenium.webdriver.common.by import By
from webdriver_manager.chrome import ChromeDriverManager

# 1. 설정
SLACK_URL = os.environ.get('SLACK_WEBHOOK_URL')
TARGET_LIKES = 50
BASE_URL = "https://wemix.com/ko/community"
DB_FILE = "last_counts.json"

def load_history():
    if os.path.exists(DB_FILE):
        try:
            with open(DB_FILE, 'r', encoding='utf-8') as f:
                return json.load(f)
        except: return {}
    return {}

def save_history(data):
    with open(DB_FILE, 'w', encoding='utf-8') as f:
        json.dump(data, f, ensure_ascii=False, indent=4)

# 2. 브라우저 설정
options = Options()
options.add_argument('--headless')
options.add_argument('--no-sandbox')
options.add_argument('--disable-dev-shm-usage')
options.add_argument('--window-size=1920,1080')
options.add_argument("user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")

driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=options)

try:
    print("🚀 위믹스 커뮤니티 접속 중...")
    driver.get(BASE_URL)
    time.sleep(12) # 로딩 대기 충분히

    # 스크롤 내리기
    for i in range(25):
        driver.execute_script("window.scrollTo(0, document.body.scrollHeight);")
        time.sleep(1)

    history = load_history()
    updated_posts = []
    current_results = {}

    # [수정 포인트] 위믹스 커뮤니티의 게시글 리스트를 담은 공통 태그를 찾습니다.
    # 텍스트가 아닌 '구조'를 분석하여 접근합니다.
    posts = driver.find_elements(By.CSS_SELECTOR, "div.css-175oi2r") 

    print(f"📊 분석 대상 요소 발견: {len(posts)}개")

    for p in posts:
        try:
            txt = p.text
            # 게시글 데이터셋인지 확인 (조회수, 좋아요가 모두 포함된 텍스트 덩어리)
            if 'Views' in txt and ' ' in txt:
                lines = [l.strip() for l in txt.split('\n') if l.strip()]
                
                # 정밀 인덱싱: 위믹스 카드 구조상 Views 기준 앞뒤 추출
                v_idx = -1
                for idx, line in enumerate(lines):
                    if 'Views' in line:
                        v_idx = idx
                        break
                
                if v_idx >= 3:
                    title = lines[v_idx - 3]
                    likes = int(''.join(filter(str.isdigit, lines[v_idx + 1])))
                    
                    if likes >= TARGET_LIKES and not title.isdigit():
                        old_likes = history.get(title, 0)
                        if likes > old_likes:
                            status = "🆕 신규" if old_likes == 0 else f"📈 상승 ({old_likes}→{likes})"
                            updated_posts.append({"title": title, "likes": likes, "status": status})
                        current_results[title] = likes
        except: continue

    driver.quit()

    # 슬랙 전송
    if updated_posts:
        print(f"✅ 알림 대상 {len(updated_posts)}건 발견. 슬랙 전송 시작...")
        for p in updated_posts:
            msg = {"text": f"🚨 *[위믹스 감시]*\n*{p['status']}*\n👉 {p['title']}\n❤️ 좋아요: {p['likes']}개"}
            res = requests.post(SLACK_URL, json=msg)
            print(f"📤 전송 결과: {res.status_code}")
        save_history(current_results)
    else:
        print("📭 오늘 보고할 변동 사항이 없습니다.")

except Exception as e:
    print(f"❌ 에러: {e}")
    if 'driver' in locals(): driver.quit()
